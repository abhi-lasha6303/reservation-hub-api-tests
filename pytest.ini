[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*

# Rootdir on sys.path so `config`, `clients` and `data` import cleanly
# without needing an installed package or a PYTHONPATH export.
pythonpath = .

addopts =
    -ra
    --strict-markers
    --html=reports/test-report.html
    --self-contained-html

markers =
    health: feature area -- service health
    auth: feature area -- authentication and authorisation
    create: feature area -- booking creation and input validation
    read: feature area -- booking retrieval
    update: feature area -- booking amendment (PUT and PATCH)
    delete: feature area -- booking cancellation
    contract: feature area -- response schema and contract
    search: feature area -- booking search and filters
    critical: risk -- money, data integrity, or access control
    high: risk -- core journey or partner integration breakage
    medium: risk -- correctness and contract detail
    defect(id): fails because of a known API defect documented in BUGS.md
